<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="qiuxi903">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010409"/>
      <stop offset="0.45" stop-color="#06233d"/>
      <stop offset="1" stop-color="#0d2f52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0079ba"/>
      <stop offset="1" stop-color="#4ab8fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#37a8ec" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#37a8ec" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#4ab8fd" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#dots)"/>
  <ellipse cx="600" cy="130" rx="520" ry="150" fill="url(#glow)"/>

  <!-- 装饰字符 -->
  <text x="96" y="215" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="76" fill="#4ab8fd" fill-opacity="0.10">&lt;/&gt;</text>
  <text x="1104" y="215" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="76" fill="#4ab8fd" fill-opacity="0.10" text-anchor="end">&lt;/&gt;</text>

  <text x="600" y="146" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,system-ui,sans-serif" font-size="72" font-weight="700" fill="#f0f6fc" letter-spacing="6">qiuxi903</text>

  <rect x="530" y="180" width="140" height="4" rx="2" fill="url(#accent)"/>
</svg>
