name: Generate stats

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: read

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate stats and contribution SVGs
        env:
          GH_USER: qiuxi903
        run: node scripts/generate-stats.mjs

      - name: Bump image versions in README
        run: node scripts/bump-versions.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: update stats and contribution graphs"
            git push
          fi
